<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Plagas e Insecticidas</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #eef2f3, #cfd9df);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2 {
      color: #003366;
    }

    form, .seccion {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background-color: #003366;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0059b3;
    }

    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }

    #plagasForm, #insecticidasForm, #tablaPlagas, #tablaInsecticidas, #tablaDiagnosticos {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Panel de Administración</h1>

  <select id="menu" onchange="cambiarVista()">
    <option value="">Selecciona una opción</option>
    <option value="plagas">Gestionar Plagas</option>
    <option value="insecticidas">Gestionar Insecticidas</option>
    <option value="diagnosticos">Ver Diagnósticos</option>
  </select>

  <!-- Plagas -->
  <form id="plagasForm">
    <h2>Agregar Plaga</h2>
    <label>Nombre: <input type="text" name="nombre" required /></label>
    <label>Descripción: <input type="text" name="descripcion" required /></label>
    <label>Tipo: <input type="text" name="tipo" required /></label>
    <button type="submit">Guardar Plaga</button>
  </form>

  <div class="seccion" id="tablaPlagas">
    <h2>Plagas Registradas</h2>
    <table><thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th></tr></thead><tbody id="plagasBody"></tbody></table>
  </div>

  <!-- Insecticidas -->
  <form id="insecticidasForm">
    <h2>Agregar Insecticida</h2>
    <label>Nombre: <input type="text" name="nombre" required /></label>
    <label>Compuesto: <input type="text" name="compuesto" required /></label>
    <label>Aplicación: <input type="text" name="aplicacion" required /></label>
    <label>Plaga: <select name="plagaId" id="selectPlagas"></select></label>
    <button type="submit">Guardar Insecticida</button>
  </form>

  <div class="seccion" id="tablaInsecticidas">
    <h2>Insecticidas Registrados</h2>
    <table><thead><tr><th>ID</th><th>Nombre</th><th>Plaga</th></tr></thead><tbody id="insecticidasBody"></tbody></table>
  </div>

  <!-- Diagnósticos -->
  <div class="seccion" id="tablaDiagnosticos">
    <h2>Historial de Diagnósticos</h2>
    <table><thead><tr><th>Fecha</th><th>Agricultor</th><th>Plaga</th><th>Resultado</th><th>Recomendación</th></tr></thead><tbody id="diagnosticosBody"></tbody></table>
  </div>

  <script>
    const urlBase = 'http://localhost:3000';

    function cambiarVista() {
      const vista = document.getElementById('menu').value;
      const secciones = ['plagasForm', 'tablaPlagas', 'insecticidasForm', 'tablaInsecticidas', 'tablaDiagnosticos'];
      secciones.forEach(id => document.getElementById(id).style.display = 'none');

      if (vista === 'plagas') {
        document.getElementById('plagasForm').style.display = 'block';
        document.getElementById('tablaPlagas').style.display = 'block';
        cargarPlagas();
      }
      if (vista === 'insecticidas') {
        document.getElementById('insecticidasForm').style.display = 'block';
        document.getElementById('tablaInsecticidas').style.display = 'block';
        cargarPlagasSelect();
        cargarInsecticidas();
      }
      if (vista === 'diagnosticos') {
        document.getElementById('tablaDiagnosticos').style.display = 'block';
        cargarDiagnosticos();
      }
    }

    document.getElementById('plagasForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      await fetch(`${urlBase}/plagas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      e.target.reset();
      cargarPlagas();
    });

    document.getElementById('insecticidasForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      data.plagaId = Number(data.plagaId);
      await fetch(`${urlBase}/insecticidas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      e.target.reset();
      cargarInsecticidas();
    });

    async function cargarPlagas() {
      const res = await fetch(`${urlBase}/plagas`);
      const plagas = await res.json();
      const body = document.getElementById('plagasBody');
      body.innerHTML = '';
      plagas.forEach(p => {
        body.innerHTML += `<tr><td>${p.id}</td><td>${p.nombre}</td><td>${p.tipo}</td></tr>`;
      });
    }

    async function cargarPlagasSelect() {
      const res = await fetch(`${urlBase}/plagas`);
      const plagas = await res.json();
      const select = document.getElementById('selectPlagas');
      select.innerHTML = '';
      plagas.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
      });
    }

    async function cargarInsecticidas() {
      const res = await fetch(`${urlBase}/insecticidas`);
      const lista = await res.json();
      const body = document.getElementById('insecticidasBody');
      body.innerHTML = '';
      lista.forEach(i => {
        body.innerHTML += `<tr><td>${i.id}</td><td>${i.nombre}</td><td>${i.plaga?.nombre || '-'}</td></tr>`;
      });
    }

    async function cargarDiagnosticos() {
      const res = await fetch(`${urlBase}/diagnosticos`);
      const diagnosticos = await res.json();
      const body = document.getElementById('diagnosticosBody');
      body.innerHTML = '';

      for (const d of diagnosticos) {
        let nombre = 'No registrado';
        try {
          const u = await fetch(`${urlBase}/users/${d.userId}`);
          const usuario = await u.json();
          nombre = usuario.nombre || 'No registrado';
        } catch (err) {
          console.warn('Usuario no encontrado:', d.userId);
        }

        body.innerHTML += `
          <tr>
            <td>${new Date(d.fecha).toLocaleDateString()}</td>
            <td>${nombre}</td>
            <td>${d.plaga?.nombre || 'No registrado'}</td>
            <td>${d.resultado || 'No registrado'}</td>
            <td>${d.recomendacion || 'No registrado'}</td>
          </tr>`;
      }
    }
  </script>
</body>
</html>
