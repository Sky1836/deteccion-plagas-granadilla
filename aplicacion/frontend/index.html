<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #001634, #0077ff);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: #fff;
      color: #000;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      background-color: #001634;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #004299;
    }

    .google-btn {
      background-color: #db4437;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Inicia sesión</h2>
    <input type="email" id="email" placeholder="Correo electrónico" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button onclick="loginEmail()">Entrar</button>
    <button class="google-btn" onclick="loginGoogle()">Entrar con Google</button>
    <p id="mensaje"></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDmq96wgClrtqs4zu4Ns0Ci5-T9zgiqnW0",
      authDomain: "granadilla-93b10.firebaseapp.com",
      projectId: "granadilla-93b10",
      appId: "1:530799065336:web:68ba547887ac0a5399630d",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function sendTokenToBackend(token) {
        try {
            const res = await fetch('http://localhost:3000/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }), // ✅ ahora sí manda el token real
            });

            const data = await res.json();
            console.log("Usuario autenticado:", data.user);
            document.getElementById("mensaje").innerText = `Hola ${data.user.nombre || data.user.email}`;
        } catch (err) {
            console.error("Error al conectar con backend:", err);
            alert("No se pudo conectar con el servidor");
        }
    }


    async function loginEmail() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const token = await result.user.getIdToken();
        sendTokenToBackend(token);
      } catch (err) {
        alert("Error de autenticación: " + err.message);
      }
    }

    async function loginGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        const token = await result.user.getIdToken();
        sendTokenToBackend(token);
      } catch (err) {
        alert("Error con Google: " + err.message);
      }
    }
  </script>
</body>
</html>
